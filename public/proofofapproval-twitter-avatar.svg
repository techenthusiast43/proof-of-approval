<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#112a2a" />
      <stop offset="70%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#060911" />
    </radialGradient>

    <!-- Shield / Badge Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="40%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Checkmark & Core Glow -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Cyan Accent -->
    <linearGradient id="cyanAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="28" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGlow)" />

  <!-- Outer Tech Hexagon / Ring Glow -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.15" />
  <circle cx="256" cy="256" r="172" fill="none" stroke="url(#cyanAccent)" stroke-width="3" stroke-dasharray="14 12" stroke-opacity="0.35" />

  <!-- Glowing Aura behind Shield -->
  <path d="M 256,105 L 375,155 C 375,270 256,365 256,395 C 256,365 137,270 137,155 Z"
        fill="#10b981" opacity="0.18" filter="url(#neonGlow)" />

  <!-- Main Outer Shield Body -->
  <path d="M 256,110 L 370,160 C 370,270 256,360 256,390 C 256,360 142,270 142,160 Z"
        fill="#0d1927" stroke="url(#cyanAccent)" stroke-width="4.5" filter="url(#softShadow)" />

  <!-- Inner Shield Bevel Layer -->
  <path d="M 256,132 L 350,174 C 350,260 256,335 256,362 C 256,335 162,260 162,174 Z"
        fill="url(#shieldGrad)" opacity="0.15" />

  <!-- Inner Accent Shield Line -->
  <path d="M 256,145 L 335,182 C 335,255 256,320 256,344 C 256,320 177,255 177,182 Z"
        fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.4" />

  <!-- Dynamic Verification Nodes -->
  <circle cx="256" cy="148" r="6" fill="#a7f3d0" filter="url(#neonGlow)" />
  <circle cx="180" cy="182" r="4.5" fill="#34d399" opacity="0.8" />
  <circle cx="332" cy="182" r="4.5" fill="#34d399" opacity="0.8" />
  <circle cx="256" cy="340" r="4" fill="#10b981" opacity="0.9" />

  <!-- Stylized Modern Checkmark -->
  <path d="M 205,252 L 243,290 L 315,205"
        fill="none"
        stroke="url(#checkGrad)"
        stroke-width="26"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#neonGlow)" />

  <!-- Front Checkmark Highlight -->
  <path d="M 205,252 L 243,290 L 315,205"
        fill="none"
        stroke="#ffffff"
        stroke-width="10"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.75" />
</svg>
